# Build + release + deploy, from the shared app-builder pipeline.
name: Build + deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  app:
    uses: drsamonline/app-builder/.github/workflows/build.yml@d3243de862fa0477840205bbe2f41cb3f2f4950c
    with:
      app_name: weft8-kit
      app_src: docs/play
      deploy_path: docs
    permissions:
      contents: write
      pages: write
      actions: write    # the shot job dispatches the run that publishes its picture
      id-token: write
